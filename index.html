<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Meu Pagamento</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;padding:14px;max-width:480px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}.c{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:#555;display:block;margin-bottom:3px}
input{width:100%;height:42px;font-size:16px;padding:0 8px;border:1px solid #ccc;border-radius:8px}
button{width:100%;height:48px;font-size:16px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;margin-bottom:12px}
.r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:15px}.r:last-child{border:0}
.n{color:#b91c1c}.l{background:#dcfce7;color:#166534;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.l b{font-size:26px}#st{font-size:13px;color:#555;margin:0 0 10px}
</style></head><body>
<h1>Meu Pagamento</h1>
<button id="b1">Tirar foto</button>
<button id="b2" style="background:#fff;color:#1d4ed8;border:1px solid #1d4ed8">Anexar arquivo (foto ou PDF)</button>
<input type="file" id="f1" accept="image/*" capture="environment" hidden>
<input type="file" id="f2" accept="image/*,application/pdf" hidden>
<p id="st" style="white-space:pre-line"></p>
<div class="c"><div class="g">
<div><label>Mês</label><input type="month" id="m"></div>
<div><label>Valor da hora (R$)</label><input type="number" id="vh" step="0.01" value="11.07"></div>
<div><label>Pontos azuis (R$)</label><input type="number" id="pa" step="0.01" value="0"></div>
<div><label>Domingos + feriados</label><input type="number" id="df" step="1"></div>
<div><label>Atraso (R$)</label><input type="number" id="at" step="0.01" value="0"></div>
<div><label>Imposto de renda (R$)</label><input type="number" id="ir" step="0.01" value="0"></div>
</div></div>
<div class="c">
<div class="r"><span>Horas do mês</span><span id="a"></span></div>
<div class="r"><span>Pontos azuis</span><span id="b"></span></div>
<div class="r"><span>Repouso remunerado</span><span id="c"></span></div>
<div class="r"><b>Bruto</b><b id="d"></b></div>
<div class="r"><span>Atraso</span><span class="n" id="e"></span></div>
<div class="r"><span>Vale 40%</span><span class="n" id="v"></span></div>
<div class="r"><span>INSS</span><span class="n" id="i"></span></div>
<div class="r"><span>Imposto de renda</span><span class="n" id="j"></span></div>
</div>
<div class="l"><span>Líquido</span><b id="liq"></b></div>
<script>
window.onerror=function(m,u,l){var e=document.getElementById('st');if(e)e.textContent='Erro: '+m+' (linha '+l+')'};
var $=function(i){return document.getElementById(i)};
var R=function(x){return Math.round(x*100+1e-9)/100},T=function(x){return Math.floor(x*100+1e-9)/100};
var F=function(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
var FX=[[0,1],[3,21],[4,1],[8,7],[9,12],[10,2],[10,15],[10,20],[11,25]];
function feriados(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,g=Math.floor((8*b+13)/25),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),di=((h+l-7*m+114)%31)+1;
return FX.map(function(x){return new Date(y,x[0],x[1])}).concat([new Date(y,mo-1,di-2)])}
function inss(base){var fx=[[1621.00,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]],t=0,ant=0;
for(var i=0;i<fx.length&&base>ant;i++){t+=T((Math.min(base,fx[i][0])-ant)*fx[i][1]);ant=fx[i][0]}return R(t)}
function auto(){var p=$('m').value.split('-').map(Number),y=p[0],mo=p[1],n=new Date(y,mo,0).getDate(),k=0;
for(var d=1;d<=n;d++)if(new Date(y,mo-1,d).getDay()===0)k++;
feriados(y).forEach(function(x){if(x.getMonth()===mo-1&&x.getDay()!==0)k++});$('df').value=k;calc()}
function calc(){var p=$('m').value.split('-').map(Number),n=new Date(p[0],p[1],0).getDate(),vh=+$('vh').value,pa=+$('pa').value,df=+$('df').value,at=+$('at').value,ir=+$('ir').value;
var h=HN!=null?R(HN*vh):R(220*vh*n/30),dsr=T(pa/26*df),br=R(h+pa+dsr),vale=R(220*vh*.4),is=inss(R(br-at));
$('a').textContent=F(h);$('b').textContent=F(pa);$('c').textContent=F(dsr);$('d').textContent=F(br);
$('e').textContent='− '+F(at);$('v').textContent='− '+F(vale);$('i').textContent='− '+F(is);$('j').textContent='− '+F(ir);
$('liq').textContent=F(R(br-at-vale-is-ir));try{localStorage.setItem('vh',$('vh').value)}catch(e){}}
function num(s){return parseFloat(s.replace(/\./g,'').replace(',','.'))}
var COD=['051','101','107','121','151','154'],HN=null;
function st(t){$('st').textContent=t}
function js(u){return new Promise(function(ok,no){var e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=function(){no(new Error('sem acesso a '+u.split('/')[2]))};document.head.appendChild(e)})}
function mes(txt){var re=/(?:Compet|Referente)[^\d]*(\d{2})\/(20\d{2})/i,m=txt.match(re);if(m)return m;
var g=/(\d{2})\/(20\d{2})/g,x;while((x=g.exec(txt))){var p=x.index>0?txt.charAt(x.index-1):'';if(p!=='/'&&!/\d/.test(p))return x}return null}
function ehCartao(t){return /CART.O DE PONTO/i.test(t)||/Qtd\.?\s*Movto/i.test(t)}
var FAT={'051':.35,'101':1.5,'107':2,'121':1.5,'151':1,'154':1,'210':1};
function acha(txt){var re=/(^|[^\d,.\/])(\d{3})\s+(?=[A-Za-zÀ-ú])/g,m,pos=[],pa=0,at=0,det=[],cart=ehCartao(txt),vh=+$('vh').value,Q=['001','003','031'],hn=0,hq=0,h51=false;
while((m=re.exec(txt)))pos.push({c:m[2],i:m.index+m[0].length,s:m.index+m[1].length});
pos.forEach(function(p,k){var q3=cart&&Q.indexOf(p.c)>=0;if(COD.indexOf(p.c)<0&&p.c!=='210'&&!q3)return;var seg=txt.slice(p.i,k+1<pos.length?pos[k+1].s:txt.length),cut=seg.search(/Total |Válido|Contribui|Base C/);if(cut>=0)seg=seg.slice(0,cut);
var x,t;
if(cart){var q=seg.match(/\d{1,3}[.,]\d{3}(?![\d,])/);if(!q)return;var h=parseFloat(q[0].replace(',','.'));if(q3){hn+=h;hq++;return}x=R(h*vh*FAT[p.c]);t=p.c+': '+h.toFixed(3)+' h = '+F(x)}
else{var v=seg.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g);if(!v)return;x=num(v[v.length-1]);t=p.c+': '+F(x)}
if(p.c==='051')h51=true;if(p.c==='210'){at+=x;det.push(t)}else{pa+=x;det.push(t)}});
return{pa:pa,at:at,det:det,cart:cart,hn:hq?hn:null,h51:h51}}
function estima(txt){var re=/(\d{2})[:.](\d{2})\s*[oO0]?\s+(\d{2})[:.](\d{2})\s*[oO0]?\s+(\d{2})[:.](\d{2})\s*[oO0]?\s+(\d{2})[:.](\d{2})/g,m,n=0,tot=0;
while((m=re.exec(txt))){var t=[],i;for(i=0;i<4;i++)t.push(+m[1+2*i]*60+ +m[2+2*i]);
if(t[0]<900||t[0]>1230||m[1]>'23'||m[3]>'23'||m[5]>'23'||m[7]>'23')continue;
for(i=1;i<4;i++)while(t[i]<t[i-1])t[i]+=1440;
tot+=Math.max(0,Math.min(t[1],1740)-Math.max(t[0],1320))+Math.max(0,Math.min(t[3],1740)-Math.max(t[2],1320));n++}
return{n:n,min:tot}}
function aplica(txt,info){var r=acha(txt),mm=null,fp=txt.match(/Fim Ponto[^\d]{0,6}(\d{2})\/(\d{2})\/(20\d{2})/i),vh=+$('vh').value,aviso='';
if(r.cart&&fp)mm=[null,fp[2],fp[3]];else mm=mes(txt);
if(mm&&+mm[1]>=1&&+mm[1]<=12)$('m').value=mm[2]+'-'+mm[1];
if(r.cart&&!r.h51&&r.det.length){var e=estima(txt);
if(e.n>=5){var hh=e.min/52.5,xx=R(hh*vh*.35);r.pa+=xx;r.det.push('051 (não consta na folha; estimado pelas batidas de '+e.n+' dias): '+hh.toFixed(3)+' h = '+F(xx));aviso='\nAtenção: o código 051 não está nesta folha. O valor dele é uma estimativa (pode variar cerca de R$ 2). Se tiver o valor certo, corrija os pontos azuis.'}
else aviso='\nAtenção: o código 051 não está nesta folha e não consegui estimar. Some o 051 à mão nos pontos azuis.'}
HN=r.cart?r.hn:null;
if(r.det.length){$('pa').value=R(r.pa);$('at').value=R(r.at);auto();
st('Lido: '+r.det.join(' | ')+(HN!=null?'\nHoras normais da folha: '+HN.toFixed(3)+' h':'')+'\n'+info+(r.cart?'\nCartão de Ponto: valores calculados pelas horas (estimativa). O valor oficial é o do Demonstrativo.':'')+aviso+'\nConfira antes de usar.')}
else{auto();st('Não encontrei os códigos 051, 101, 107, 121, 151, 154 e 210 neste arquivo.\n'+info+(ehCartao(txt)?'\nÉ um Cartão de Ponto, mas não achei a tabela de eventos (Qtd Movto).':'')+'\nPreencha os campos à mão.')}}
function rot(src,g){var w=src.width,h=src.height,k=Math.min(2.5,2600/Math.max(w,h)),c=document.createElement('canvas'),q=g%180!==0;
c.width=Math.round((q?h:w)*k);c.height=Math.round((q?w:h)*k);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
x.translate(c.width/2,c.height/2);x.rotate(g*Math.PI/180);x.filter='grayscale(1) contrast(1.4)';x.drawImage(src,-w*k/2,-h*k/2,w*k,h*k);return c}
async function leitor(){if(!window.Tesseract)await js('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
return Tesseract.createWorker('por',1,{logger:function(m){if(m.status)st('Lendo a imagem: '+m.status+' '+Math.round((m.progress||0)*100)+'%')}})}
async function ocrRot(w,src){var best='',bn=-1;for(var g of [0,90,270]){st('Lendo a imagem inteira (giro '+g+'°)…');
var t=(await w.recognize(rot(src,g))).data.text,n=acha(t).det.length;if(n>bn){bn=n;best=t}if(n>=3)break}return best}
async function imagem(f){var w;try{st('Carregando leitor de imagem…');w=await leitor();var bmp=await createImageBitmap(f);
var t=await ocrRot(w,bmp);aplica(t,'Imagem lida por inteiro.')}catch(e){st('Falha na leitura da imagem: '+(e&&e.message||e)+'\nPreencha os campos à mão.')}
if(w)try{await w.terminate()}catch(e){}}
async function pdf(f){var w;try{st('Lendo o PDF…');var buf=await f.arrayBuffer();
if(!window.pdfjsLib)await js('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var d=await pdfjsLib.getDocument({data:buf}).promise,txt='',vaz=[];
for(var p=1;p<=d.numPages;p++){var pg=await d.getPage(p),it=(await pg.getTextContent()).items.slice().sort(function(a,b){return b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]}),pt='';
var ln=[],y=null;it.forEach(function(t){if(y===null||Math.abs(t.transform[5]-y)>3){ln.push([]);y=t.transform[5]}ln[ln.length-1].push(t)});
ln.forEach(function(l){l.sort(function(a,b){return a.transform[4]-b.transform[4]});pt+=l.map(function(t){return t.str}).join(' ')+'\n'});
txt+=pt;if(pt.replace(/\s/g,'').length<50)vaz.push(pg)}
if(!acha(txt).det.length&&vaz.length){w=await leitor();for(var pg2 of vaz){var vp=pg2.getViewport({scale:2.5}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
await pg2.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;txt+='\n'+await ocrRot(w,cv)}}
aplica(txt,'PDF lido: '+d.numPages+' página(s).')
}catch(e){st('Falha ao abrir o PDF: '+(e&&e.message||e)+'\nPreencha os campos à mão.')}
if(w)try{await w.terminate()}catch(e){}}
function arq(f){if(!f){st('Nenhum arquivo recebido.');return}st('Arquivo recebido: '+f.name+' ('+Math.round(f.size/1024)+' KB)');
if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))pdf(f);else imagem(f)}
['1','2'].forEach(function(n){$('b'+n).addEventListener('click',function(){$('f'+n).value='';$('f'+n).click()});
$('f'+n).addEventListener('change',function(){arq(this.files&&this.files[0])})});
['vh','pa','df','at','ir'].forEach(function(i){$(i).addEventListener('input',calc)});$('m').addEventListener('input',function(){HN=null;auto()});
try{var s=localStorage.getItem('vh');if(s)$('vh').value=s}catch(e){}
var hj=new Date();$('m').value=hj.getFullYear()+'-'+('0'+(hj.getMonth()+1)).slice(-2);auto();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
